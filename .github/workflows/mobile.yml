name: Mobile checks
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        flavor: [development, staging]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install exact Flutter revision
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      - name: Verify compiled flavor configuration boundaries
        if: runner.os == 'Linux' && matrix.flavor == 'development'
        run: bash tool/verify_flavor_config.sh
      - name: Android debug compile
        if: runner.os == 'Linux'
        run: flutter build apk --debug --flavor ${{ matrix.flavor }}
      - name: iOS simulator compile
        if: runner.os == 'macOS'
        run: flutter build ios --simulator --debug --no-codesign --flavor ${{ matrix.flavor }}
      - name: Package unsigned simulator application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ios/simulator-${{ matrix.flavor }}.zip
      - name: Retain unconfigured engineering artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-unconfigured-${{ runner.os }}-${{ matrix.flavor }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-debug.apk
            apps/mobile/build/ios/simulator-${{ matrix.flavor }}.zip
